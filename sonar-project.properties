# Configuración del análisis de SonarQube (la lee sonar-scanner desde la raíz del proyecto).
# El servidor y el token no van aquí: los pasa el Jenkinsfile (-Dsonar.host.url / -Dsonar.token).
sonar.projectKey=MP_202630_G81_E3_Front
sonar.projectName=MP_202630_G81_E3_Front
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Cobertura generada por `npm run coverage` (Vitest + V8 → lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Falla el pipeline si no se cumple el Quality Gate
sonar.qualitygate.wait=true
