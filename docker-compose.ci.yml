# Servidores locales de calidad que pide la guía: Jenkins + SonarQube.
#
#   docker compose -f docker-compose.ci.yml up -d --build
#
#   Jenkins   → http://localhost:8085/jenkins
#   SonarQube → http://localhost:9000/sonar   (usuario admin / contraseña admin; te pedirá cambiarla)
#
# En Linux, SonarQube necesita (una vez por arranque del equipo):
#   sudo sysctl -w vm.max_map_count=262144
name: mp-ci

services:
  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_WEB_CONTEXT: /sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  jenkins:
    build: ./docker/jenkins
    user: root # necesario para usar el socket de Docker del equipo
    environment:
      JENKINS_OPTS: --prefix=/jenkins
    ports:
      - '8085:8080'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:

networks:
  # Red con nombre fijo: el Jenkinsfile conecta sus contenedores de trabajo a ella
  # para que puedan llegar a SonarQube con el nombre "sonarqube".
  default:
    name: mp-ci
