# Front (nginx) y, opcionalmente, el back construido desde su repositorio hermano.
#
#   docker compose up --build                          → solo el front (http://localhost:8081)
#   docker compose --profile with-backend up --build   → front + back
#   BACKEND_URL=http://host.docker.internal:8080 docker compose up --build
#                                                      → front en Docker y back corriendo en tu máquina
name: mp-front

services:
  frontend:
    build: .
    image: mp-202630-g81-e3-front:local
    ports:
      - '${FRONT_PORT:-8081}:80'
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  backend:
    profiles: ['with-backend']
    build:
      # Carpeta del back clonado junto a este repositorio.
      context: ${BACKEND_CONTEXT:-../MP_202630_G81_E3_Back}
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21 AS build
        WORKDIR /app
        COPY pom.xml .
        COPY src ./src
        RUN mvn -q -B -DskipTests package
        FROM eclipse-temurin:21-jre
        WORKDIR /app
        COPY --from=build /app/target/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    restart: unless-stopped
